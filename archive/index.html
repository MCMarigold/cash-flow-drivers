<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marigold Cash Flow Driver Archive</title>
<style>
  :root{
    --black:#1a1a1a; --gold:#f4c94c; --gold-dark:#b8922e;
    --line:#e6e2d8; --ready:#4a8a5c; --blocked:#c0503f; --waiting:#c98a2c; --paper:#fdfcf9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:Georgia,'Times New Roman',serif;color:#2a2a2a;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 60px;}
  header{border-bottom:3px solid var(--black);padding-bottom:16px;margin-bottom:24px;}
  .back{font-family:Arial,sans-serif;font-size:12px;color:var(--gold-dark);text-decoration:none;font-weight:bold;}
  .back:hover{text-decoration:underline;}
  h1{font-size:26px;margin:10px 0 4px 0;color:var(--black);}
  .meta{font-family:Arial,sans-serif;font-size:12.5px;color:#7a7a7a;}

  /* Month-to-month navigator */
  .nav-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:8px;
  }
  .nav-btn{
    font-family:Arial,sans-serif; font-size:13px; font-weight:bold; color:var(--black);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:9px 14px; cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:background .15s, box-shadow .15s;
  }
  .nav-btn:hover:not(:disabled){background:#f5f2ea; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .nav-btn:disabled{color:#c9c2b3; border-color:var(--line); cursor:default; background:#fff;}
  .nav-center{text-align:center; flex:1;}
  .nav-dots{font-family:Arial,sans-serif; font-size:11px; color:#b0aa9c; margin-top:2px;}
  .nav-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--line); margin:0 2px;}
  .nav-dot.active{background:var(--gold-dark);}

  .month-section{margin-bottom:36px;}
  .month-head{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;}
  .month-name{font-size:19px;font-weight:bold;color:var(--black);}
  .month-name .live-pill{
    font-family:Arial,sans-serif; font-size:10.5px; font-weight:bold; letter-spacing:0.3px;
    color:#fff; background:var(--waiting); border-radius:10px; padding:2px 8px; margin-left:8px;
    vertical-align:middle; text-transform:uppercase;
  }
  .month-note{font-family:Arial,sans-serif;font-size:11.5px;color:#8a8a8a;}

  /* Board — same layout/orientation as the live dashboard */
  .board{display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:14px;align-items:stretch;}
  .row-label{
    writing-mode:vertical-rl; transform:rotate(180deg);
    font-family:Arial,sans-serif; font-size:13px; font-weight:bold; letter-spacing:1px;
    text-transform:uppercase; color:#fff; background:var(--black);
    padding:14px 8px; border-radius:8px; flex:0 0 34px;
    display:flex; align-items:center; justify-content:center;
  }
  .row-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; flex:1;}

  a.card{
    display:flex; flex-direction:column; justify-content:space-between; gap:10px;
    text-decoration:none; color:inherit;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; min-height:90px;
    transition:box-shadow .15s, transform .15s;
  }
  a.card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.08); transform:translateY(-1px);}
  a.card.placeholder{background:#f5f2ea; color:#9a9186; pointer-events:none; cursor:default;}

  .driver-num{
    font-family:Arial,sans-serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.5px; color:var(--gold-dark); font-weight:bold;
  }
  .placeholder .driver-num{color:#b0aa9c;}
  .driver-name{font-size:14.5px; font-weight:bold; line-height:1.25;}
  .driver-owner{font-family:Arial,sans-serif; font-size:11px; color:#8a8a8a;}

  .card-bottom{display:flex; align-items:baseline; justify-content:space-between;}
  .pct{font-size:22px; font-weight:bold; font-family:Arial,sans-serif;}
  .pct.neg{color:var(--blocked);}
  .pct.pos{color:var(--ready);}
  .pct.draft{color:var(--waiting);}
  .pct.neutral{color:#8a8a8a;}
  .pct.tbd{color:#b0aa9c; font-size:13px; font-style:italic;}
  .target{font-family:Arial,sans-serif; font-size:10.5px; color:#8a8a8a;}

  .multi-rows{display:flex; flex-direction:column; gap:5px; margin-top:2px;}
  .multi-row{display:flex; align-items:baseline; justify-content:space-between; font-family:Arial,sans-serif;}
  .multi-row .mlbl{font-size:10.5px; color:#8a8a8a;}
  .multi-row .mpct{font-size:14px; font-weight:bold;}
  .multi-row .mpct.pos{color:var(--ready);}
  .multi-row .mpct.neg{color:var(--blocked);}
  .multi-row .mpct.draft{color:var(--waiting);}
  .multi-row .mpct.neutral{color:#8a8a8a;}
  .multi-row .mtgt{font-size:9.5px; color:#b0aa9c; margin-left:4px; font-weight:normal;}

  .live-flag{font-family:Arial,sans-serif; font-size:9.5px; color:var(--waiting); font-style:italic; margin-top:2px;}

  footer{
    margin-top:28px; font-family:Arial,sans-serif; font-size:11.5px; color:#8a8a8a;
    border-top:1px solid var(--line); padding-top:14px;
  }

  @media (max-width:640px){
    .row{flex-direction:column;}
    .row-label{writing-mode:horizontal-tb; transform:none; flex:0 0 auto; padding:6px 10px;}
    .row-cards{grid-template-columns:1fr;}
    .nav-btn span.lbl{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back" href="../index.html">&larr; Back to dashboard</a>
    <h1>Cash Flow Driver Archive</h1>
    <div class="meta">Frozen month-end checkpoints of the full dashboard &middot; same layout as the live board &middot; use the arrows below to page through months</div>
  </header>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" type="button">&larr; <span class="lbl">Older</span></button>
    <div class="nav-center">
      <div class="nav-dots" id="navDots"></div>
    </div>
    <button class="nav-btn" id="nextBtn" type="button"><span class="lbl">Newer</span> &rarr;</button>
  </div>

  <div id="stage">
    <div class="month-section">
      <div class="month-head"><div class="month-name">Loading…</div></div>
    </div>
  </div>

  <footer id="footerNote">Loading archive history…</footer>

</div>

<script>
// Pages through the archive one month at a time (arrows / dots / left-right
// keyboard keys). Slide 0 is always "Current" — pulled live from the
// driver-N.html pages the same way the live dashboard does, one level up
// from this page. Slides after that are archived checkpoints from
// data/history.json, newest first, so the natural flow after archiving a
// new month is: land here on Current, press the left arrow once to land
// exactly on last month's frozen checkpoint. Adding a new month is still
// just appending to history.json — no HTML edits needed here.
(function () {
  const DRIVER_GROUPS = [
    { label: 'MHI', nums: [1, 5, 6] },
    { label: 'MHS', nums: [2, 4, 9] },
    { label: 'OPS', nums: [3, 7, 8] },
  ];
  const ALL_DRIVER_NUMS = [1, 2, 3, 4, 5, 6, 7, 8, 9];

  let slides = [];   // [{ key, label, current, drivers: {n: data|undefined} }]
  let idx = 0;        // current slide index into `slides`

  function stateClass(state) {
    return ['pos', 'neg', 'draft', 'neutral'].includes(state) ? state : '';
  }

  function renderCardBottom(data) {
    if (Array.isArray(data.metrics) && data.metrics.length) {
      const wrap = document.createElement('div');
      wrap.className = 'multi-rows';
      data.metrics.forEach(m => {
        const row = document.createElement('div');
        row.className = 'multi-row';
        const cls = stateClass(m.state);
        row.innerHTML = `
          <span class="mlbl">${m.label}</span>
          <span><span class="mpct ${cls}">${m.value}</span>${m.target ? `<span class="mtgt">${m.target}</span>` : ''}</span>
        `;
        wrap.appendChild(row);
      });
      return wrap;
    }
    if (data.headline) {
      const bottom = document.createElement('div');
      bottom.className = 'card-bottom';
      const cls = stateClass(data.headline.state);
      bottom.innerHTML = `
        <div class="pct ${cls}">${data.headline.value}</div>
        <div class="target">${data.headline.target || ''}</div>
      `;
      return bottom;
    }
    const bottom = document.createElement('div');
    bottom.className = 'card-bottom';
    bottom.innerHTML = '<div class="pct tbd">see page</div>';
    return bottom;
  }

  function renderCard(slide, n, data) {
    const a = document.createElement('a');
    const href = slide.current ? `../driver-${n}.html` : `${slide.key}/driver-${n}.html`;
    if (!data) {
      a.className = 'card placeholder';
      a.href = slide.current ? href : '#';
      a.innerHTML = `
        <div>
          <div class="driver-num">Driver ${n}</div>
          <div class="driver-name">${slide.current ? 'Not built yet' : 'Not archived this month'}</div>
          <div class="driver-owner">&nbsp;</div>
        </div>
        <div class="card-bottom"><div class="pct tbd">TBD</div></div>
      `;
      return a;
    }
    a.className = 'card';
    a.href = href;
    const ownerLine = [data.owner ? `Owner: ${data.owner}` : null, data.period || null]
      .filter(Boolean).join(' · ');
    const top = document.createElement('div');
    top.innerHTML = `
      <div class="driver-num">Driver ${n}</div>
      <div class="driver-name">${data.name || ''}</div>
      <div class="driver-owner">${ownerLine || '&nbsp;'}</div>
      ${data.note ? `<div class="live-flag">Live state, not a closed month</div>` : ''}
    `;
    a.appendChild(top);
    a.appendChild(renderCardBottom(data));
    return a;
  }

  function renderSlide(slide) {
    const section = document.createElement('div');
    section.className = 'month-section';

    const archivedCount = ALL_DRIVER_NUMS.filter(n => slide.drivers[n]).length;

    const head = document.createElement('div');
    head.className = 'month-head';
    head.innerHTML = `
      <div class="month-name">${slide.label}${slide.current ? '<span class="live-pill">Live</span>' : ''}</div>
      <div class="month-note">${slide.current ? `${archivedCount} of 9 driver pages loaded` : `${archivedCount} of 9 drivers archived`}</div>
    `;
    section.appendChild(head);

    const board = document.createElement('div');
    board.className = 'board';
    DRIVER_GROUPS.forEach(group => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="row-label">${group.label}</div>`;
      const rowCards = document.createElement('div');
      rowCards.className = 'row-cards';
      group.nums.forEach(n => {
        rowCards.appendChild(renderCard(slide, n, slide.drivers[n]));
      });
      row.appendChild(rowCards);
      board.appendChild(row);
    });
    section.appendChild(board);
    return section;
  }

  function renderDots() {
    const dots = document.getElementById('navDots');
    dots.innerHTML = slides
      .map((s, i) => `<span class="nav-dot${i === idx ? ' active' : ''}"></span>`)
      .join('');
  }

  function renderStage() {
    const stage = document.getElementById('stage');
    stage.innerHTML = '';
    stage.appendChild(renderSlide(slides[idx]));
    renderDots();
    // idx 0 (Current, the newest) can't go further right/newer; the oldest
    // archived slide can't go further left/older.
    document.getElementById('nextBtn').disabled = idx === 0;
    document.getElementById('prevBtn').disabled = idx === slides.length - 1;
  }

  function goTo(newIdx) {
    if (newIdx < 0 || newIdx >= slides.length) return;
    idx = newIdx;
    renderStage();
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(idx + 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(idx - 1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo(idx + 1);
    if (e.key === 'ArrowRight') goTo(idx - 1);
  });

  async function loadCurrentDrivers() {
    const drivers = {};
    await Promise.all(ALL_DRIVER_NUMS.map(async (n) => {
      try {
        const res = await fetch(`../driver-${n}.html`, { cache: 'no-cache' });
        if (!res.ok) return;
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const block = doc.getElementById('driver-summary');
        if (!block) return;
        drivers[n] = JSON.parse(block.textContent);
      } catch (e) { /* leave undefined -> placeholder card */ }
    }));
    return drivers;
  }

  Promise.all([
    fetch('../data/history.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : { months: {} }).catch(() => ({ months: {} })),
    loadCurrentDrivers(),
  ]).then(([history, currentDrivers]) => {
    const months = history.months || {};
    const archivedKeys = Object.keys(months).sort().reverse();

    slides = [
      { key: 'current', label: 'Current', current: true, drivers: currentDrivers },
      ...archivedKeys.map(k => ({
        key: k,
        label: months[k].label || k,
        current: false,
        drivers: months[k].drivers || {},
      })),
    ];
    idx = 0;
    renderStage();

    document.getElementById('footerNote').textContent = archivedKeys.length
      ? `Use the arrows (or ← / → keys) to page between the live current board and each frozen checkpoint, newest to oldest. To add a new checkpoint, use the "Generate archive snapshot" tool on the live dashboard (index.html?tools=1) — it adds a month to data/history.json and this page picks it up automatically, no edits needed here.`
      : `No months archived yet — you're looking at the live current board. Once you archive a month with the "Generate archive snapshot" tool on the live dashboard (index.html?tools=1), the left arrow will step back to it.`;
  });
})();
</script>
</body>
</html>
